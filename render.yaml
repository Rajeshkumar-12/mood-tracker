services:
  - type: web
    name: foodstall
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn food:app
    envVars:
      - key: PORT
        value: 10000
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_PORT
        value: "3306"
